# AI Model Router model catalog
# Snapshot reviewed 2026-09-18. Prices are USD per 1K tokens, estimates only.
# Sources: https://openrouter.ai/api/v1/models
# https://developers.openai.com/api/docs/models/o3-mini
# https://platform.claude.com/docs/en/about-claude/model-deprecations
# https://ai.google.dev/gemini-api/docs/pricing
# https://console.groq.com/docs/models
#
# This file is the routable model set. It is deliberately small and curated by
# hand, so adding a model is a one block change here.
#
# What lives here: task tags, a quality estimate, a latency baseline and a
# pricing snapshot for when the network is unavailable. The quality figure is a
# maintainer estimate on a 0 to 100 scale, not a benchmark result, so treat it
# as an opinion you can change.
#
# What is fetched: live prices and context limits, pulled from the public
# OpenRouter catalog by the running instance every refresh_hours and mirrored
# into SQLite. No key is required, and there is no sync command to remember.
#
# A fetched price is only adopted when OpenRouter bills it: for an openrouter
# entry, or where openrouter_id sits under the provider's own namespace. A
# provider that hosts open weights itself keeps the price written here.
#
# `speed_index` and `price_index` are derived from latency and live pricing at
# refresh time, so they never need to be maintained by hand.

settings:
  # How often a running instance refreshes prices from OpenRouter.
  refresh_hours: 6
  catalog_url: https://openrouter.ai/api/v1/models

models:
  - provider: openai
    model: gpt-4o-mini
    openrouter_id: openai/gpt-4o-mini
    strengths: [chat, summarization, translation, email, customer_support, agent_step]
    quality: 71
    latency_ms: 400
    context: 128000
    vision: true
    functions: true
    price: { input: 0.00015, output: 0.0006 }

  - provider: openai
    model: gpt-4o
    openrouter_id: openai/gpt-4o
    strengths: [reasoning, coding, chat, debugging, data_analysis, planning, writing]
    quality: 86
    latency_ms: 800
