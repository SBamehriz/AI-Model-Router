name: Feature request
description: Suggest an improvement to the self-hosted router.
body:
  - type: textarea
    id: usecase
    attributes:
      label: Use case
      description: What are you trying to do, and where does the current behavior fall short?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed change
      description: Include alternatives or trade-offs you have considered.
