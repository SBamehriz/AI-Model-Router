name: Bug report
description: Report a reproducible problem.
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include what you expected and the steps to reproduce. Remove API keys and private prompts.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, browser, and commit or branch.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Completion mode
      options:
        - Offline (simulated)
        - Live provider
        - Not sure
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste sanitized logs or the request ID. Never paste credentials.
      render: text
